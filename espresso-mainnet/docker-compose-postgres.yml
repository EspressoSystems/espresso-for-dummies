#
# WARNING: We recommend running `docker compose up -d postgres` and ensure postgres initializes itself before deploying the sequencer
#
services:
  node:
    image: ghcr.io/espressosystems/espresso-network/espresso-node:20260828
    stop_grace_period: 15m
    entrypoint:
      - tini
      - -g
      - --
    command:
      - /bin/espresso-node-postgres
      - --
      - storage-sql
      - --
      - http
      - --
      - catchup
      - --
      - config
      - --
      - explorer
      - --
      - light-client
      - --
      - query
      - --
      - status
    environment:
      - RUST_LOG=warn,hotshot_libp2p_networking=off
      #- RUST_LOG_FORMAT=json
      - ESPRESSO_NODE_API_PORT=8088
      - ESPRESSO_NODE_GENESIS_FILE=/genesis/mainnet.toml
      - ESPRESSO_NODE_API_PEERS=https://cache.main.net.espresso.network/,https://query.main.net.espresso.network/
      - ESPRESSO_NODE_CONFIG_PEERS=https://cache.main.net.espresso.network/,https://query.main.net.espresso.network/
      - ESPRESSO_NODE_STATE_PEERS=https://cache.main.net.espresso.network/,https://query.main.net.espresso.network/
      - ESPRESSO_STATE_RELAY_SERVER_URL=https://state-relay.main.net.espresso.network
      - ESPRESSO_NODE_CDN_ENDPOINT=cdn.main.net.espresso.network:1737

      #
      # Error and node telemetry reporting (optional)
      #
      - ESPRESSO_NODE_TELEMETRY_LOGS_ENABLE=true
      - ESPRESSO_NODE_TELEMETRY_METRICS_ENABLE=true

      #
      # Libp2p
      #
      - ESPRESSO_NODE_LIBP2P_BIND_ADDRESS=0.0.0.0:4455
      - ESPRESSO_NODE_LIBP2P_ADVERTISE_ADDRESS=${PUBLIC_IP:?error}:4455
      - ESPRESSO_NODE_LIBP2P_BOOTSTRAP_NODES=/dns/main-network-d26f3636a4e56b65.elb.us-east-2.amazonaws.com/udp/2000/quic-v1/p2p/12D3KooWDKf3RMqrRu7jsbsskPGbdPyzVknmzM7KtMUbR9obHACu,/dns/main-network-d26f3636a4e56b65.elb.us-east-2.amazonaws.com/udp/2001/quic-v1/p2p/12D3KooWK9YtnNqFQ51by23zv6PmGdzrADf8HhzsPRAbyAM5MZh5,/dns/main-network-d26f3636a4e56b65.elb.us-east-2.amazonaws.com/udp/2002/quic-v1/p2p/12D3KooWJK5yrh2h7QDbk53mQR3mYQKTfkkiJfTkPkifi6RFmgQc,/dns/main-network-d26f3636a4e56b65.elb.us-east-2.amazonaws.com/udp/2003/quic-v1/p2p/12D3KooWGgju14hJGLeGds5Ey8vTDC5E9AhcZm86S4gx4b1ZHANA,/dns/main-network-d26f3636a4e56b65.elb.us-east-2.amazonaws.com/udp/2004/quic-v1/p2p/12D3KooWLSztiG7tPdjJpPdN7H86SiVVBMRVjCT3AbtWGHRyUm2R

      #
      # Cliquenet
      #
      - ESPRESSO_NODE_CLIQUENET_BIND_ADDRESS=0.0.0.0:9977
      - ESPRESSO_NODE_CLIQUENET_ADVERTISE_ADDRESS=${PUBLIC_IP:?error}:9977

      #
      # Postgres
      #
      - ESPRESSO_NODE_POSTGRES_HOST=postgres
      - ESPRESSO_NODE_POSTGRES_USER=postgres
      - ESPRESSO_NODE_POSTGRES_DATABASE=sequencer
      - ESPRESSO_NODE_POSTGRES_USE_TLS=false
      - ESPRESSO_NODE_DATABASE_MAX_CONNECTIONS=40
      - ESPRESSO_NODE_DATABASE_MIN_CONNECTIONS=2

      #
      # Pruning
      #
      #- ESPRESSO_NODE_DATABASE_PRUNE=true
      #- ESPRESSO_NODE_PRUNER_PRUNING_THRESHOLD=10GB
      #- ESPRESSO_NODE_PRUNER_MINIMUM_RETENTION=1d
      #- ESPRESSO_NODE_PRUNER_TARGET_RETENTION=14d
      #- ESPRESSO_NODE_PRUNER_MAX_USAGE=8000
      #- ESPRESSO_NODE_PRUNER_INTERVAL=1h

      #
      # Secrets
      #
      - ESPRESSO_L1_PROVIDER=${ESPRESSO_NODE_L1_PROVIDER:?error}
      - ESPRESSO_L1_WS_PROVIDER=${ESPRESSO_NODE_L1_WS_PROVIDER:?error}
      - ESPRESSO_NODE_POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?error}
      # New mnemonic to so we only need one secret
      - ESPRESSO_NODE_KEY_MNEMONIC=${ESPRESSO_NODE_KEY_MNEMONIC:?error}

      #
      # Old pre-mnemonic manual key process
      #
      #- ESPRESSO_NODE_PRIVATE_STAKING_KEY=${ESPRESSO_NODE_PRIVATE_STAKING_KEY:?error}
      #- ESPRESSO_NODE_PRIVATE_STATE_KEY=${ESPRESSO_NODE_PRIVATE_STATE_KEY:?error}
      #- ESPRESSO_NODE_PRIVATE_X25519_KEY=${ESPRESSO_NODE_PRIVATE_X25519_KEY:?error}

      #
      # Optional Node Identification
      #
      #- ESPRESSO_NODE_IDENTITY_NODE_NAME=Our-Node-1
      #- ESPRESSO_NODE_IDENTITY_COMPANY_NAME=Example Company
      #- ESPRESSO_NODE_IDENTITY_COMPANY_WEBSITE=https://example.com
      #- ESPRESSO_NODE_IDENTITY_OPERATING_SYSTEM=Linux
      #- ESPRESSO_NODE_IDENTITY_NETWORK_TYPE=AWS
      #- ESPRESSO_NODE_IDENTITY_COUNTRY_CODE=US
      #- ESPRESSO_NODE_IDENTITY_LATITUDE=0.0
      #- ESPRESSO_NODE_IDENTITY_LONGITUDE=0.0
    ports:
      - 8088:8088 # General HTTP
      - 4455:4455/tcp # Libp2p
      - 4455:4455/udp # Libp2p
      - 9977:9977/tcp # Cliquenet
    volumes:
      - ./datastore:/store/sequencer
  postgres:
    image: postgres:17
    stop_grace_period: 15m
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?error}
      - POSTGRES_DB=sequencer
    ports:
      - 5432
    volumes:
      - postgres:/var/lib/postgresql/data
volumes:
  postgres:
